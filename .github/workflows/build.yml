name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir:.
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: Sto-R-APK
          path:./bin/*.apk
